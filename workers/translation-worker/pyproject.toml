[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videodubber-translation-worker"
version = "0.1.0"
description = "VideoDubber translation worker — local/offline-first FastAPI service backed by Argos Translate (port 5102)."
readme = "README.md"
# Pinned to CPython 3.12.x — the SAME interpreter the app bundles
# (resources/python/cpython-3.12.16-*) and the same one the engine-pack venvs use
# (UV_PYTHON_VERSION). A 3.13 venv is not a neutral choice here: the shipped
# macOS workers were frozen from a Homebrew python@3.13 built on macOS 26, which
# tagged every bundled dylib minos 26.0 and made the workers refuse to start on
# the macOS 13.5 the app advertises. It also resolves a different dependency set
# (e.g. libretranslate pins numpy<2 on <=3.12 and numpy==2.3.5 on >=3.13), so the
# two OSes shipped two stacks under one version number. Fail loudly instead.
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "VideoDubber" }]
# Mirrors requirements.txt, ceilings included — see the note there on why the
# upper bounds exist (FastAPI no longer caps Starlette).
dependencies = [
  "fastapi>=0.162,<0.163",
  "starlette>=1.10,<2",
  "uvicorn[standard]>=0.54,<0.55",
  "argostranslate==1.11.0",
  "minisbd>=0.9.5,<1",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "httpx2>=2.16,<3",      # required by fastapi.testclient (Starlette >=1.10 deprecates plain httpx)
]

# Cloud providers are optional/future scaffolds (see app/providers.py).
# Install only if/when you wire them up:
#   pip install ".[cloud]"
cloud = [
  # "deepl>=1.16",
  # "google-cloud-translate>=3.15",
  # "azure-ai-translation-text>=1.0",
  # "openai>=1.30",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  # Tests that need a real installed Argos language pair. They self-skip when
  # the machine has none, so they are ON by default: the whole point of
  # tests/test_glossary_argos.py is that the fake backend cannot tell us
  # whether the glossary sentinels survive a real NMT decoder.
  "argos: exercises an actually-installed Argos package (skipped when absent)",
]
